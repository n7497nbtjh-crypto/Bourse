# Test de la source Eulerpool (comptes trimestriels mondiaux) : affiche une comparaison, n'écrit rien dans le site.
name: Test Eulerpool
on:
  workflow_dispatch:
    inputs:
      essais:
        description: 'JSON {id: isin} (vide = liste par défaut)'
        required: false
      cours:
        description: 'Comparer les cours Eulerpool et Google (nombre de sociétés)'
        required: false
      sonde:
        description: 'ISIN à sonder (points d accès)'
        required: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comparaison
        env:
          EULERPOOL_KEY: ${{ secrets.EULERPOOL_KEY }}
          ESSAIS: ${{ inputs.essais }}
        run: if [ -n "${{ inputs.cours }}" ]; then node data/eulerpool_cours.mjs --verifier ${{ inputs.cours }}; elif [ -n "${{ inputs.sonde }}" ]; then node data/eulerpool_sonde.mjs ${{ inputs.sonde }}; else node data/eulerpool_test.mjs; fi
