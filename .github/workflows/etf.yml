# Collecte mensuelle des ETF : catalogues officiels des émetteurs (frais, encours, PEA, cotations) et composition de chaque fonds.
#   - le 3 de chaque mois vers 5 h 40 (heure de Paris en hiver) ;
#   - à la main : onglet Actions > « ETF : catalogue et compositions » > Run workflow.
# Écrit data/etf_catalogue.json, data/etf_compo_choisis.json et cf/site/data/etf/<id>.json, puis relance la mise en ligne du site.
name: "ETF : catalogue et compositions"
on:
  workflow_dispatch: {}
  schedule:
    - cron: "41 4 * * 1"
permissions:
  contents: write
  actions: write
concurrency:
  group: etf
  cancel-in-progress: false
jobs:
  etf:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collecte
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null || echo "::warning::pdftotext indisponible : fiches HSBC ignorées"
          npm i --no-save --silent xlsx@0.18.5 || echo "::warning::module xlsx indisponible : compositions SPDR ignorées"
          node data/etf_collecte.mjs
          node tests/t_etf.mjs
      - name: Contrôle
        run: |
          # 13/11 : une collecte partielle (200 ETF au lieu de 1 148) avait remplacé le catalogue et retiré 948 ETF du site.
          # Le catalogue ne peut plus perdre plus de 5 % de ses ETF d'un passage à l'autre : sinon le robot s'arrête sans rien écrire.
          git show HEAD:data/etf_catalogue.json > /tmp/catalogue_avant.json
          node -e 'const c=require("./data/etf_catalogue.json"), a=require("/tmp/catalogue_avant.json"), n=c.list.length, n0=a.list.length; if (n < 150 || n < n0 * 0.95) { console.log("::error::catalogue des ETF refusé : " + n + " ETF contre " + n0 + " avant (collecte incomplète)"); process.exit(1); } console.log(n, "ETF au catalogue (" + n0 + " avant)")'
          node build.mjs
      - name: Enregistrement des données dans le dépôt
        run: |
          git config user.name "repere-bot"
          git config user.email "repere-bot@users.noreply.github.com"
          git add data/etf_catalogue.json data/etf_compo_choisis.json data/hsbc_isins.json cf/site/data/etf
          git diff --cached --quiet && exit 0
          git commit -m "ETF : catalogue et compositions du $(date +%F)"
          git checkout -- . && git clean -fdq -- cf/site   # fichiers refaits par build.mjs : la mise en ligne les reconstruit
          ok=0; for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs -q && git push && ok=1 && break; sleep 10; done
          [ "$ok" = 1 ] || { echo "::error::enregistrement impossible"; exit 1; }
      - name: Mise en ligne
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main || echo "::warning::mise en ligne à relancer à la main"
