# Synthèses de presse de la semaine écrites à l'avance (8/11, Romain : « le rapport doit être disponible dès le samedi matin, voire le vendredi
# soir », « 75 synthèses prérédigées »). Vendredi soir après la clôture de Wall Street avec la part gratuite d'IA du vendredi (40), puis samedi
# 0 h 23 UTC avec celle du samedi (35), avant le rapport (espace.yml, 6 h 17 UTC). Sans clé : le site arrête le robot si la part du jour est épuisée.
name: Synthèses de presse
on:
  schedule:
    - cron: "37 21 * * 5"   # vendredi 22 h 37 à Paris l'hiver, après la clôture de Wall Street
    - cron: "23 0 * * 6"    # samedi 1 h 23 à Paris : nouvelle part gratuite du jour
  workflow_dispatch:
permissions:
  contents: read
jobs:
  presse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node data/presse_chauffe.mjs
        env:
          MAX: ${{ github.event.schedule == '23 0 * * 6' && '35' || '40' }}
