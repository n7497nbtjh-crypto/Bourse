# Ancres de preuve (1/11/2026) : relit le dernier rapport ESEF de chaque entreprise et garde l'identifiant de chaque chiffre affiché,
# pour que le site ouvre le document officiel exactement sur ce chiffre (voir data/ancres.mjs). Chaque nuit, après les logos.
name: Ancres de preuve
on:
  workflow_dispatch:
    inputs:
      max:
        description: "Nombre d'entreprises à relire"
        default: "800"
  schedule:
    - cron: "10 1 * * *"   # chaque nuit vers 2 h 10 (heure de Paris en hiver)
permissions:
  contents: write
concurrency:
  group: ancres
  cancel-in-progress: false
jobs:
  ancres:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Lecture des rapports (filings.xbrl.org)
        timeout-minutes: 70
        env:
          CONTACT: ${{ vars.CONTACT || secrets.CONTACT }}
          DUREE_MIN: "60"
        run: |
          # Node 22 plante parfois dans undici sur de longues séries de téléchargements : on relance, les entreprises déjà lues sont gardées
          export FIN=$(( $(date +%s) + 3600 ))
          for i in 1 2 3 4 5 6 7 8; do node data/ancres.mjs --max "${{ inputs.max || '400' }}" && break; [ $(date +%s) -ge $FIN ] && break; echo "::warning::Relance ($i)"; done
      - name: Enregistrement dans le dépôt
        if: always()
        run: |
          git config user.name "repere-bot"
          git config user.email "repere-bot@users.noreply.github.com"
          git add cf/site/data/ancres
          git diff --cached --quiet || git commit -m "Ancres de preuve du $(date +%F)"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs -q && git push && { ok=1; break; }; sleep 5; done; [ -n "$ok" ] || { echo "::error::Publication refusée par git : rien n'a été mis en ligne"; exit 1; }
