# Comptes des sociétés absentes des sources structurées (4/11/2026) : rapport annuel publié sur le site de chaque entreprise
# (data/rapports_site.mjs : robots.txt respecté, paquet ESEF ou rapport PDF, compte de résultat consolidé et bilan, contrôles).
# Rattrapage d'abord (toutes les 6 heures), à alléger ensuite (une fois par semaine suffira : un rapport annuel par an).
name: Rapports annuels des sites
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Durée de la recherche (minutes)"
        default: "150"
      tout:
        description: "Retenter aussi les échecs récents (1 = oui)"
        default: "0"
      ids:
        description: "Seulement ces sociétés (identifiants séparés par des virgules)"
        default: ""
  schedule:
    - cron: "10 3 * * 3"   # 13/11 (recentrage) : une fois par semaine, le mercredi (avant : toutes les 6 heures ; le rattrapage est fini, les derniers passages ne trouvaient plus rien)
permissions:
  contents: write
concurrency:
  group: rapports-site
  cancel-in-progress: false
jobs:
  rapports:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Outil de lecture des PDF et navigateur (pages dont les liens sont écrits par un programme)
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          npm install --no-save --no-audit --no-fund playwright@1.64 >/dev/null
          for i in 1 2 3; do npx playwright install --with-deps chromium >/dev/null && break; echo "::warning::Installation du navigateur : essai $i raté"; sleep 30; done
      - name: Recherche des rapports, par tranches de 40 minutes enregistrées une à une
        timeout-minutes: 170
        run: |
          node tests/t_rapports_site.mjs
          if [ "${{ inputs.tout }}" = "1" ]; then rm -f data/rapports_site_cache.json; fi
          git config user.name "repere-bot"
          git config user.email "repere-bot@users.noreply.github.com"
          # 4/11 : le passage en un seul bloc (10 en parallèle) a fait tomber la machine au bout de 1 h 10 sans rien enregistrer.
          # Désormais 4 en parallèle et un enregistrement dans le dépôt après chaque tranche.
          total=${{ inputs.minutes || '150' }}; fait=0
          while [ $fait -lt $total ]; do
            t=$(( total - fait < 40 ? total - fait : 40 ))
            # 4/11 soir : 2e chute de la machine sans journal (run 41899303521) : tranche coupée net si elle déborde,
            # 2 sociétés à la fois, mémoire et disque notés à chaque tranche pour connaître la cause d'un prochain échec.
            timeout -k 60 $(( t * 60 + 300 )) node --max-old-space-size=3072 data/rapports_site.mjs --minutes $t --paralleles 2 ${{ inputs.ids && format('--ids {0}', inputs.ids) || '' }} || echo "::warning::tranche interrompue (code $?)"
            free -m | head -2; df -h . | tail -1; rm -rf /tmp/rs-* 2>/dev/null || true
            git add data/rapports_site_cache.json cf/site/data/societes cf/site/data/societes.json
            git diff --cached --quiet || git commit -q -m "Rapports annuels des sites du $(date +%F) (tranche)"
            for i in 1 2 3; do git pull --rebase --autostash -X theirs -q && git push -q && { ok=1; break; }; sleep 5; done; [ -n "$ok" ] || { echo "::error::Publication refusée par git : rien n'a été mis en ligne"; exit 1; }
            fait=$(( fait + t ))
            node -e 'const c=require("./data/rapports_site_cache.json");console.log(Object.values(c).filter(x=>x.ok).length,"comptes trouvés au total,",Object.keys(c).length,"sociétés cherchées")'
          done
