# Diagnostic ponctuel : se lance quand data/diag/demande.txt change ; écrit data/diag/segments.json
name: Diagnostic
on:
  push:
    branches: [main]
    paths: ["data/diag/demande.txt"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          CONTACT: ${{ vars.CONTACT }}
        run: |
          node data/diag_seg.mjs $(cat data/diag/demande.txt)
          git config user.name "repere-bot"; git config user.email "repere-bot@users.noreply.github.com"
          git add data/diag; git commit -m "Diagnostic" || true; git pull --rebase -q; git push
