# Diagnostic ponctuel : se lance quand data/diag/test.mjs change ; écrit data/diag/out.json
name: Diagnostic
on:
  push:
    branches: [main]
    paths: ["data/diag/test.mjs"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          CONTACT: ${{ vars.CONTACT }}
        run: |
          npm i --no-save --silent pdfjs-dist@4.10.38 || true
          node data/diag/test.mjs || true
          git config user.name "repere-bot"; git config user.email "repere-bot@users.noreply.github.com"
          git add data/diag; git commit -m "Diagnostic" || true
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; sleep 5; done
