# Espace personnel : alertes du soir (notifications sur le site) et bilan de la semaine préparé le samedi matin.
# Les e-mails ne sont plus que de courts messages « Votre bilan de la semaine est prêt » (lien vers /espace),
# envoyés seulement aux personnes qui l'ont demandé et si un service d'envoi est configuré.
# Ne fait rien tant que le secret ADMIN_KEY n'est pas défini (dans GitHub ET dans Cloudflare, même valeur).
name: espace
on:
  schedule:
    - cron: "43 17 * * *"   # chaque soir, 17 h 43 UTC : alertes après la clôture européenne
    - cron: "17 6 * * 0,1,6"    # samedi, dimanche et lundi 6 h 17 UTC : rapport de la semaine, le jour choisi par chacun (samedi par défaut)
  workflow_dispatch:
    inputs:
      quoi: { description: "alertes, bilan (tout le monde) ou jour (rapport de ceux qui l'ont choisi ce jour-là) ; vide : automatique", default: "" }
jobs:
  espace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Préparer alertes et bilans
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          SITE: https://repere-bourse.pages.dev
          QUOI: ${{ github.event.inputs.quoi }}
          PLANNING: ${{ github.event.schedule }}
        run: |
          if [ -z "$ADMIN_KEY" ]; then echo "ADMIN_KEY absent : rien à faire."; exit 0; fi
          if [ -z "$QUOI" ] && [ "$PLANNING" = "17 6 * * 0,1,6" ]; then QUOI=jour; fi
          Q=""; if [ -n "$QUOI" ]; then Q="?quoi=$QUOI"; fi
          for i in $(seq 1 60); do
            R=$(curl -sS -X POST -H "x-admin-key: $ADMIN_KEY" "$SITE/api/espace/tache$Q" || echo '{}')
            echo "$R"
            L=$(echo "$R" | jq -r '.reste // 0' 2>/dev/null || echo 0)
            if [ "$L" = "0" ]; then break; fi
            sleep 3
          done
