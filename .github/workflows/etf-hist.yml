# Robot de l'historique des ETF (3/11/2026) : performances officielles des émetteurs (voir data/etf_historique.mjs).
# Amundi (valeur liquidative ajustée des dividendes), iShares (performance dividendes réinvestis, convertie en euros au taux BCE)
# HSBC (fiche mensuelle officielle, 6/11), SPDR et Invesco (fichiers Excel officiels de valeur liquidative, 7/11).
# Chaque samedi, il réécrit cf/site/data/etf-hist/<id>.json et cf/site/data/etf-perf.json.
name: Historique des ETF
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 6"   # chaque samedi vers 6 h 17 (heure de Paris en hiver)
permissions:
  contents: write
concurrency:
  group: etf-hist
  cancel-in-progress: false
jobs:
  historique:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lecteur de PDF (fiches mensuelles HSBC)
        run: command -v pdftotext >/dev/null || sudo apt-get install -y -qq poppler-utils >/dev/null || true
      - name: Lecteur Excel (fichiers officiels SPDR et Invesco)
        run: |
          npm i --no-save --silent xlsx@0.18.5 || echo "::warning::module xlsx indisponible, SPDR et Invesco ignorés"
      - name: Collecte (Amundi, iShares, HSBC, SPDR, Invesco, taux BCE)
        timeout-minutes: 35
        run: node data/etf_historique.mjs
      - name: Enregistrement dans le dépôt
        if: always()
        run: |
          git config user.name "repere-bot"
          git config user.email "repere-bot@users.noreply.github.com"
          git add cf/site/data/etf-hist cf/site/data/etf-perf.json
          git diff --cached --quiet || git commit -m "Historique des ETF du $(date +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; sleep 5; done
