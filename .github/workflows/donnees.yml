# Collecte des comptes annuels et fabrication du site prêt à déposer sur Cloudflare.
# Lancement à la main : onglet Actions > « Mise à jour des données » > Run workflow.
# À la fin : ouvrir l'exécution, section Artifacts, télécharger « repere-site »,
# puis glisser ce fichier dans Cloudflare Pages (comme pour Kartel Des Cartes).
# Les comptes annuels ne changent qu'une fois par an : une collecte par an suffit (après avril).
name: Mise à jour des données
on:
  workflow_dispatch: {}
  push:                    # se lance aussi quand la liste des entreprises ou la collecte changent
    branches: [main]
    paths: ["data/univers.mjs", "data/esef.mjs", "data/fetch_data.mjs", ".github/workflows/donnees.yml"]
permissions:
  contents: write
jobs:
  donnees:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collecte (GLEIF, filings.xbrl.org)
        env:
          CONTACT: ${{ vars.CONTACT }}
        run: node data/fetch_data.mjs
      - name: Construction et tests
        run: |
          node build.mjs
          node tests/t_calc.mjs
          node tests/t_univers.mjs
          NO_SLEEP=1 node tests/t_esef.mjs
      - name: Site prêt à déposer sur Cloudflare
        uses: actions/upload-artifact@v4
        with:
          name: repere-site
          path: cf/site
          retention-days: 30
      - name: Enregistrement des données dans le dépôt
        run: |
          git config user.name "repere-bot"
          git config user.email "repere-bot@users.noreply.github.com"
          git add cf/site/data cf/site/sitemap.xml cf/site/_worker.js
          git diff --cached --quiet || git commit -m "Données du $(date +%F)"
          git push
