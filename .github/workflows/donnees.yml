# Le « bot » du site : met à jour les données puis publie le site sur Cloudflare.
#  - chaque jour : annonces et dates estimées (SEC), comptes des sociétés dont la dernière lecture date de plus de 7 jours ;
#  - à chaque modification de la liste des entreprises ou de la collecte ;
#  - à la main : onglet Actions > « Mise à jour des données » > Run workflow.
# Les cours viennent en direct des modules TradingView et les annonces françaises en direct de l'AMF : rien à collecter pour eux.
#
# Publication automatique : il faut deux secrets dans GitHub (Settings > Secrets and variables > Actions > Secrets) :
#   CLOUDFLARE_API_TOKEN  : jeton Cloudflare avec le droit « Cloudflare Pages : Edit »
#   CLOUDFLARE_ACCOUNT_ID : identifiant du compte Cloudflare
# Sans ces secrets, le site reste à déposer à la main (fichier « repere-site » dans Artifacts).
# _routes.json : les fichiers de données (/data/*) sont servis directement, sans passer par le Worker (quota gratuit préservé).
name: Mise à jour des données
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 5 * * *"   # chaque jour vers 6 h 17 (heure de Paris en hiver)
    - cron: "47 7 * * *"   # 12/11 : passages de rattrapage (GitHub a lancé celui de 5 h 17 à 12 h 44 le 11/11) ; ils s'arrêtent tout de suite si les données du jour sont déjà en ligne
    - cron: "47 10 * * *"
  push:
    branches: [main]
    paths: ["data/univers.mjs", "data/lots/**", "data/fiches.mjs", "data/esef.mjs", "data/sec.mjs", "data/fetch_data.mjs", "data/etf.mjs", "data/etf_fetch.mjs", "data/agenda/**", "data/agenda_presse.mjs", "data/dividendes_us.mjs", "data/dividendes_europe.mjs", "data/repartitions/**", "data/gf.mjs", "build.mjs", "data/actu_analyse.mjs", ".github/workflows/donnees.yml"]
permissions:
  contents: write
concurrency:
  group: donnees
  cancel-in-progress: false
jobs:
  deja:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fait: ${{ steps.v.outputs.fait }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fait=0
          if [ "${{ github.event_name }}" = "schedule" ]; then
            jour=$(date -u +%F)
            if gh api "repos/${{ github.repository }}/commits?per_page=40&since=${jour}T00:00:00Z" -q '.[].commit.message' | grep -q "^Données du ${jour}"; then fait=1; fi
          fi
          echo "fait=$fait" >> "$GITHUB_OUTPUT"; echo "Données du jour déjà publiées : $fait"
  donnees:
    needs: deja
    if: needs.deja.outputs.fait != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cours (feuilles Google, valeurs liquidatives, Eulerpool)
        # 12/11 : les cours passent en premier, dans leur propre étape. Avant, ils venaient après la collecte : quand elle plantait ou dépassait son temps, les cours n'étaient pas relevés (cours figés au 10/11 pendant deux jours).
        timeout-minutes: 20
        continue-on-error: true
        run: |
          EULERPOOL_KEY="${{ secrets.EULERPOOL_KEY }}" node data/cours_fetch.mjs || echo "::error::Cours non mis à jour"
      - name: Collecte (GLEIF, filings.xbrl.org, SEC)
        # Arrêt au bout de 110 minutes sans tout perdre : les comptes déjà lus sont enregistrés plus bas, la suite au passage suivant
        timeout-minutes: 110
        continue-on-error: true
        env:
          CONTACT: ${{ vars.CONTACT || secrets.CONTACT }}
        run: |
          if [ -n "$CONTACT" ]; then echo "Contact SEC : renseigné"; else echo "::warning::Contact SEC absent : ajoutez la variable CONTACT (Settings > Secrets and variables > Actions > Variables)"; fi
          # Node 22 plante parfois dans undici sur de longues séries de requêtes : on relance, les sociétés déjà lues sont gardées
          for i in 1 2 3; do node data/fetch_data.mjs && break; echo "::warning::Collecte interrompue, nouvelle tentative ($i)"; done
      - name: Composition des ETF et comptes EODHD
        timeout-minutes: 30
        continue-on-error: true
        run: |
          node data/etf_fetch.mjs || echo "::warning::Composition des ETF non mise à jour"
          # Comptes manquants (Samsung, Hyundai, TCS, Aramco, ICBC, sociétés allemandes…) : EODHD, seulement si le secret EODHD_KEY existe (5e passage, A7)
          EODHD_KEY="${{ secrets.EODHD_KEY }}" node data/eodhd.mjs --max 100 || echo "::warning::Import EODHD interrompu"
      - name: Construction et tests
        env:
          CONTACT: ${{ vars.CONTACT || secrets.CONTACT }}
        run: |
          node build.mjs
          node tests/t_coherence.mjs || echo "::warning::Contrôle de cohérence : des erreurs bloquantes subsistent (voir ci-dessus)"
          node data/sec_trim.mjs || echo "::warning::Trimestres SEC : lecture interrompue"
          node data/historiser.mjs || echo "::warning::Historisation des comptes interrompue"
          # Logos : robot à part depuis le 31/10/2026 (.github/workflows/logos.yml), chaque nuit avant ce robot
          node tests/t_calc.mjs
          node tests/t_univers.mjs
          node tests/t_sec.mjs
          node tests/t_segments.mjs
          node tests/t_etf.mjs
          node tests/t_presse.mjs
          node tests/t_agenda.mjs
          node tests/t_actu.mjs
          NO_SLEEP=1 node tests/t_esef.mjs
          node tests/t_eodhd.mjs
      - name: Analyse des annonces officielles (SEC et AMF)
        env:
          CONTACT: ${{ vars.CONTACT || secrets.CONTACT }}
        run: |
          npm i --no-save --silent pdfjs-dist@4.10.38 || true
          node data/actu_analyse.mjs 2>&1 | grep -v "^Warning: TT" || echo "::warning::Analyse des annonces interrompue"
      # 7/11 : étape retirée. L'API de recherche GDELT ne répondait plus depuis GitHub (connexions coupées) et le robot réécrivait
      # agenda-auto.json avec 0 date chaque matin. Les dates annoncées sont maintenant relevées par le robot de l'actualité (data/actu.mjs).
      - name: Dividendes annoncés des entreprises américaines (calendrier Nasdaq)
        timeout-minutes: 10
        run: node data/dividendes_us.mjs || echo "::warning::Calendrier des dividendes Nasdaq interrompu"
      - name: Dividendes annoncés des entreprises européennes (annonces officielles)
        timeout-minutes: 20
        run: |
          command -v pdftotext >/dev/null || sudo apt-get install -y -qq poppler-utils >/dev/null || true
          node data/dividendes_europe.mjs --minutes 15 || echo "::warning::Dividendes européens interrompus"
      - name: Site prêt à déposer sur Cloudflare
        uses: actions/upload-artifact@v4
        with:
          name: repere-site
          path: cf/site
          retention-days: 30
      - name: Enregistrement des données dans le dépôt
        continue-on-error: true   # un conflit d'enregistrement ne doit pas empêcher la mise en ligne
        run: |
          git config user.name "repere-bot"
          git config user.email "repere-bot@users.noreply.github.com"
          git add cf/site data/diagnostic.json data/historique data/cours_ref.json data/eulerpool_cours_cache.json data/dividendes_eu_cache.json data/sec20f_cache.json
          git diff --cached --quiet || git commit -m "Données du $(date +%F)"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs -q && { node data/index_reparer.mjs; git add cf/site/data/societes.json; git diff --cached --quiet || git commit -q -m "Liste des sociétés complétée"; } && git push && { ok=1; break; }; sleep 5; done; [ -n "$ok" ] || { echo "::error::Publication refusée par git : rien n'a été mis en ligne"; exit 1; }
      - name: Publication sur Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Secrets Cloudflare absents : publication à faire à la main avec le fichier repere-site."
            exit 0
          fi
          # Le dépôt vient d'être mis à jour (git pull) : le code du site a pu changer pendant la collecte. On reconstruit
          # avant de publier, sinon le robot remettrait en ligne une version plus ancienne du site (vu le 3/11/2026).
          node build.mjs > /dev/null
          npx --yes wrangler@3.112.0 pages deploy cf/site --project-name=repere-bourse --branch=main --commit-dirty=true
