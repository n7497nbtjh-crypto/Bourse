# Met à jour les comptes des entreprises chaque lundi matin, puis enregistre le résultat dans le dépôt.
# Cloudflare Pages, relié au dépôt, republie alors le site tout seul.
name: Mise à jour des données
on:
  schedule:
    - cron: "17 4 * * 1"   # chaque lundi vers 5 h, heure de Paris
  workflow_dispatch: {}    # bouton « Run workflow » pour lancer à la main
permissions:
  contents: write
jobs:
  donnees:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collecte (GLEIF, filings.xbrl.org)
        env:
          CONTACT: ${{ vars.CONTACT }}
        run: node data/fetch_data.mjs
      - name: Construction et tests
        run: |
          node build.mjs
          node tests/t_calc.mjs
          node tests/t_univers.mjs
          NO_SLEEP=1 node tests/t_esef.mjs
      - name: Enregistrement
        run: |
          git config user.name "repere-bot"
          git config user.email "repere-bot@users.noreply.github.com"
          git add cf/site/data cf/site/sitemap.xml cf/site/_worker.js cf/src/demo-index.mjs
          git diff --cached --quiet || git commit -m "Données du $(date +%F)"
          git push
