# Cours quotidiens depuis Marketstack (data/marketstack.mjs), puis publication du site.
#  - chaque jour de semaine vers 7 h 05 (heure de Paris en hiver), après la clôture des Bourses de la veille ;
#  - à la main : onglet Actions > « Cours (Marketstack) » > Run workflow (max : nombre de requêtes autorisées ; remap : refaire la correspondance des symboles).
# Secret nécessaire : MARKETSTACK_KEY (Settings > Secrets and variables > Actions > Secrets), saisi par Romain.
name: Cours (Marketstack)
on:
  workflow_dispatch:
    inputs:
      max:
        description: "Nombre maximal de requêtes Marketstack pour cette exécution"
        default: "1500"
      remap:
        description: "Refaire la correspondance des symboles (oui/non)"
        default: "non"
  schedule:
    - cron: "5 6 * * 1-5"
permissions:
  contents: write
concurrency:
  group: donnees
  cancel-in-progress: false
jobs:
  cours:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collecte des cours
        env:
          MARKETSTACK_KEY: ${{ secrets.MARKETSTACK_KEY }}
        run: |
          if [ -z "$MARKETSTACK_KEY" ]; then echo "::error::Secret MARKETSTACK_KEY absent"; exit 1; fi
          node data/marketstack.mjs --max "${{ github.event.inputs.max || '1500' }}" $( [ "${{ github.event.inputs.remap }}" = "oui" ] && echo --remap )
      - name: Enregistrement des données dans le dépôt
        run: |
          git config user.name "repere-bot"
          git config user.email "repere-bot@users.noreply.github.com"
          git add cf/site/data/cours data/marketstack_map.json data/marketstack_tickers
          git diff --cached --quiet || git commit -m "Cours du $(date +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push && break; sleep 5; done
      - name: Construction et publication sur Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node build.mjs
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "Secrets Cloudflare absents"; exit 0; fi
          npx --yes wrangler@3.114.0 pages deploy cf/site --project-name=repere-bourse --branch=main --commit-dirty=true
