# Met en ligne l'horloge des robots chez Cloudflare (cf/horloge, 14/11/2026), voir cf/horloge/worker.mjs
name: Horloge des robots
on:
  push:
    branches: [main]
    paths: ["cf/horloge/**", ".github/workflows/horloge.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  horloge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mise en ligne
        working-directory: cf/horloge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3.112.0 deploy
