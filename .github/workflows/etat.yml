# État du site, chaque matin (7/11) : robots, actualité de la veille, contrôles de cohérence, site vu de l'extérieur, paiement, comptes.
# Résultat envoyé au serveur (POST /api/espace/etat, clé ADMIN_KEY) pour la page privée /espace/etat du propriétaire.
name: État du site
on:
  schedule:
    - cron: "5 6 * * *"   # 6 h 05 UTC, soit 7 h 05 à Paris l'hiver
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  etat:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Navigateur pour la relecture des pages
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.64 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Relever l'état du site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          SITE: https://enklair.com
        run: node scripts/etat-site.mjs
      - name: Envoyer au site
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          if [ -z "$ADMIN_KEY" ]; then echo "ADMIN_KEY absent : relevé non envoyé."; exit 0; fi
          curl -sS -X POST -H "x-admin-key: $ADMIN_KEY" -H "content-type: application/json" --data-binary @/tmp/etat-site.json https://enklair.com/api/espace/etat
