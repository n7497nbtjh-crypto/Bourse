# Séries de référence des outils (« Et si j'avais investi ? », simulateur) : indice des prix de l'Insee et taux de change de la BCE.
#   - chaque lundi vers 7 h 20 (heure de Paris en hiver) ; à la main : Actions > « Outils : séries Insee et BCE » > Run workflow.
# Écrit cf/site/data/hist-ref.json, puis relance la mise en ligne du site.
name: "Outils : séries Insee et BCE"
on:
  workflow_dispatch: {}
  schedule:
    - cron: "23 6 * * 1"
permissions:
  contents: write
  actions: write
concurrency:
  group: outils2
  cancel-in-progress: false
jobs:
  series:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collecte
        run: node data/outils2_hist.mjs
      - name: Enregistrement des données dans le dépôt
        run: |
          git config user.name "repere-bot"
          git config user.email "repere-bot@users.noreply.github.com"
          git add cf/site/data/hist-ref.json
          git diff --cached --quiet && exit 0
          git commit -m "Outils : indice des prix et taux de change du $(date +%F)"
          ok=0; for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push && ok=1 && break; sleep 10; done
          [ "$ok" = 1 ] || { echo "::error::enregistrement impossible"; exit 1; }
      - name: Mise en ligne
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main || echo "::warning::mise en ligne à relancer à la main"
