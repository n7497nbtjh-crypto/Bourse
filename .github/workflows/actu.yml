# Fil d'actualité des entreprises (data/actu.mjs) : annonces officielles (AMF, SEC, Nasdaq Nordic, Oslo Børs, FCA NSM)
# et titres de presse (GDELT, BBC News), plusieurs fois par jour en semaine. Les fichiers sont dans cf/site/data/actu/.
name: Actualité des entreprises
on:
  workflow_dispatch: {}
  schedule:
    # 8/11 (Romain : « étoffer les actualités, plus d'articles ») : toutes les 3 heures, 7 jours sur 7. Chaque passage lit au plus les
    # 4 dernières heures de presse (GDELT) : avec 5 passages en semaine seulement, la nuit et tout le week-end étaient perdus.
    - cron: "41 1,4,7,10,13,16,19,22 * * *"
permissions:
  contents: write
concurrency:
  group: actu
  cancel-in-progress: false
jobs:
  actu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collecte des annonces et de la presse
        env:
          CONTACT: ${{ vars.CONTACT || secrets.CONTACT }}
          ACTU_MINUTES: "30"
        run: |
          npm i --no-save --silent pdfjs-dist@4.10.38 || true
          node --max-old-space-size=6144 data/actu.mjs || echo "::warning::Collecte de l'actualité incomplète"
          node data/actu_analyse.mjs 2>&1 | grep -v "^Warning: TT" || echo "::warning::Analyse des annonces interrompue"
          node data/actu.mjs relire || true
      - name: Tests
        run: |
          node tests/t_actu.mjs
          node tests/t_actu2.mjs
      - name: Enregistrement des données
        run: |
          git config user.name "repere-bot"
          git config user.email "repere-bot@users.noreply.github.com"
          git add cf/site/data/actu cf/site/data/agenda-auto.json cf/site/data/actu-sec.json cf/site/data/actu-analyse.json
          git diff --cached --quiet || git commit -q -m "Actualité du $(date -u +'%F %H:%M') UTC"
          for i in 1 2 3 4 5; do git pull --rebase --autostash -X theirs -q && git push -q && { ok=1; break; }; sleep $((i * 7)); done; [ -n "$ok" ] || { echo "::error::Publication refusée par git : rien n'a été mis en ligne"; exit 1; }
      - name: Publication sur Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "Secrets Cloudflare absents."; exit 0; fi
          node build.mjs
          npx --yes wrangler@3.112.0 pages deploy cf/site --project-name=repere-bourse --branch=main --commit-dirty=true
