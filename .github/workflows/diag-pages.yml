# Diagnostic ponctuel (2/11) : état du projet Cloudflare Pages (branche de production, derniers déploiements). Ne modifie rien.
name: Diagnostic Pages
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          B="https://api.cloudflare.com/client/v4/accounts/$A/pages/projects/repere-bourse"
          curl -s -H "Authorization: Bearer $T" "$B" | jq '{production_branch: .result.production_branch, canonical: .result.canonical_deployment.short_id, canonical_stage: .result.canonical_deployment.latest_stage, latest: .result.latest_deployment.short_id, latest_stage: .result.latest_deployment.latest_stage, domains: .result.domains}'
          curl -s -H "Authorization: Bearer $T" "$B/deployments?per_page=5" | jq '.result[] | {id: .short_id, env: .environment, sha: .deployment_trigger.metadata.commit_hash[0:7], stage: .latest_stage.name, status: .latest_stage.status, aliases: .aliases}'
