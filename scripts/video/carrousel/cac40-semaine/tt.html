<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:B;src:url(brico800.ttf)}@font-face{font-family:I;src:url(Inter-ExtraBold.otf)}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:I,'Noto Color Emoji';color:#fff}
.ph{position:absolute;left:0;top:0;width:1080px;background-size:cover;background-position:center top}
.fade{position:absolute;left:0;right:0;background:linear-gradient(180deg,rgba(0,0,0,0),#000)}
.logo{position:absolute;left:56px;top:305px;background:#FFE14D;color:#111;font:800 30px B;padding:2px 12px;border:3px solid #111;transform:rotate(-3deg);z-index:5}
.txt{position:absolute;left:56px;right:190px;bottom:440px;z-index:4}
.pill{display:inline-block;background:#FFE14D;color:#111;font:800 32px B;padding:6px 18px;border:3px solid #111;transform:rotate(-3deg);margin-bottom:34px;box-shadow:5px 5px 0 #111}
.dot{display:none}
.lead{font:800 58px/1.1 B;letter-spacing:-1.2px}
.lead em{font-style:normal;color:#FFE14D}
.sub{margin-top:26px;font:700 39px/1.32 I;color:#e4e4e4}
.card{background:rgba(18,18,20,.86);border-left:12px solid #FFE14D;border-radius:6px 24px 24px 6px;padding:40px 44px 34px}
.card .lead{font-size:58px;color:#fff}
.qm{display:block;font:800 130px/0.55 B;color:#FFE14D;height:60px}
.card .src{color:#bbb}.card .src b{color:#fff}
.big{font:800 220px/1 B;letter-spacing:-8px;color:#FFE14D;margin:-10px 0 6px}
.name{position:absolute;background:#fff;color:#111;border:3px solid #111;font:800 28px I;padding:6px 14px;border-radius:10px;z-index:3}
.cr{position:absolute;left:22px;right:330px;bottom:16px;font:600 15px/1.3 I;color:rgba(255,255,255,.55);z-index:6}
.cr{top:auto!important;bottom:18px!important;left:auto!important;right:40px!important;max-width:760px;text-align:right;font:600 16px/1.3 I!important;color:rgba(255,255,255,.75)!important;text-shadow:0 1px 3px #000}
body.reel .logo{left:150px!important}body.reel .txt{left:150px!important;right:240px!important}body.reel .cr{right:150px!important;max-width:620px}
body.reel .lead{font-size:52px!important}body.reel .sub{font-size:35px!important}body.reel .big{font-size:190px!important}
.lead{font-size:68px!important}.sub{font-size:44px!important}body.reel .lead{font-size:60px!important}body.reel .sub{font-size:40px!important}.txt .src{display:none}.jours{display:flex;gap:12px;margin-top:30px}.jours span{flex:1;background:rgba(255,255,255,.1);border:3px solid #FFE14D;border-radius:16px;padding:10px 0 12px;text-align:center;font:700 26px I;color:#ddd}.jours b{display:block;font:800 40px B;color:#FFE14D;margin-top:2px}body.reel .jours span{font-size:22px}body.reel .jours b{font-size:34px}</style></head><body><div id="c"></div><script>
// [photo, hauteur photo, début du dégradé, haut du texte, html, crédit]
const S=[
['n1.jpg',1920,850,1130,`<div class="pill">CAC 40</div><div class="lead">5 jours, <em>5&nbsp;hausses</em>.</div><div class="sub">La Bourse de Paris a monté chaque jour de la semaine. Sa meilleure semaine depuis début avril.</div>`,'Sources : Euronext, AFP, 13/11 · Photo : Guilhem Vellut, Wikimedia Commons, CC BY 2.0'],
['n2.jpg',1920,850,1130,`<div class="pill">LA SEMAINE</div><div class="lead"><em>+2,82&nbsp;%</em> en cinq séances.</div><div class="jours"><span>lun.<b>+1,16</b></span><span>mar.<b>+0,55</b></span><span>mer.<b>+0,66</b></span><span>jeu.<b>+0,34</b></span><span>ven.<b>+0,09</b></span></div><div class="sub">Vendredi soir : 8&nbsp;368,91 points, le plus haut depuis fin août.</div>`,'Sources : Euronext, Boursorama, 13/11 · Photo : JLPC, Wikimedia Commons, CC BY-SA 3.0'],
['n3.jpg',1920,850,1130,`<div class="pill">LUNDI</div><div class="lead">Paris <em>efface</em> la peur de l'IA.</div><div class="sub">La semaine d'avant, les craintes sur l'intelligence artificielle avaient fait chuter la tech. Lundi, le CAC 40 a repris 1,16&nbsp;% d'un coup.</div>`,'Sources : AFP, Boursorama, 9/11 · Photo : Gugalcrom123, Wikimedia Commons, CC BY 4.0'],
['n4.jpg',1920,850,1130,`<div class="pill">VENDREDI</div><div class="lead">TotalEnergies <em>+1,9&nbsp;%</em>, le luxe freine.</div><div class="sub">Le pétrole remontait : la compagnie finit en tête du CAC 40. Kering perd 2,4&nbsp;%, dans le sillage de Richemont (Cartier).</div>`,'Sources : MoneyVox, ABC Bourse, 13/11 · Photo : Sebleouf, Wikimedia Commons, CC BY-SA 4.0'],
['n5.jpg',1920,850,1130,`<div class="pill">ET MAINTENANT&nbsp;?</div><div class="lead">Le record reste <em>4&nbsp;% plus haut</em>.</div><div class="sub">8&nbsp;726 points, le 10 août. Mardi, Nvidia publie ses résultats, les premiers depuis la démission de son patron.</div>`,'Sources : Euronext, MoneyVox, 13/11 · Photo : couscouschocolat, Wikimedia Commons, CC BY 2.0'],
['n6.jpg',1920,850,1130,`<div class="lead">Le CAC 40, <em>en&nbsp;clair</em>.</div><div class="sub">TotalEnergies, Kering, LVMH : leurs ventes, leur marge, leur dette face à leurs rivales, sur enklair.com.</div>`,'Capture d\'enklair.com, fiche TotalEnergies, 14/11 · Photo : Arthur Weidmann, Wikimedia Commons, CC BY-SA 4.0',`<div style="position:absolute;z-index:5;left:50%;top:380px;width:560px;margin-left:-280px;transform:rotate(-2deg);border:6px solid #111;border-radius:34px;overflow:hidden;box-shadow:16px 16px 0 #111;background:#fff"><img src="fichecrop.png" style="display:block;width:100%"></div>`],
];
const k=+location.hash.slice(1).split(',')[0],[img,h,f,t,html,cr,extra]=S[k-1];
const SRC=(html.match(/<div class="src">([\s\S]*?)<\/div>/)||[,''])[1].replace(/<\/?b>/g,'');
document.getElementById('c').innerHTML=`<div id="z" style="position:absolute;inset:0;transform-origin:50% 40%"><div class="ph" style="height:1920px;background-image:url(${img})"></div>${extra&&!extra.includes('fichecrop')?extra:''}</div><div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 46%,rgba(0,0,0,.84) 64%,rgba(0,0,0,.84) 90%,rgba(0,0,0,.7) 100%)"></div>${extra&&extra.includes('fichecrop')?extra:''}<div class="logo">ENKLAIR</div><div class="txt">${html}</div><div class="cr">${SRC?SRC+' · ':''}${cr}</div>`;
window.Z=v=>{document.getElementById('z').style.transform='scale('+v+')'};if(location.hash.includes(',r'))document.body.classList.add('reel');document.title='ok';
</script></body></html>
