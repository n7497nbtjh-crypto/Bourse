<style>
:root{
  --page:#F6F5F2; --panel:#FFFFFF; --ink:#141414; --grey:#5F5B55; --light:#6F6A63; --rule:#E4E1DB; --soft:#F1EFEB;
  --up:#0F7B48; --down:#C0392B; --link:#1C3D6E; --bar:#141414; --hl:#FFF7D6;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --wrap:1240px; --gut:24px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 var(--sans);font-feature-settings:"tnum" 1;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--grey)} .light{color:var(--light)}
.lnk{color:var(--link)} .lnk:hover{text-decoration:underline}

/* Barre du haut */
.bar{background:var(--bar);color:#fff;position:sticky;top:0;z-index:30;transition:transform .2s ease}
.bar.hide{transform:translateY(-100%)}
.bar .in{display:flex;align-items:center;gap:28px;height:56px}
.logo{font-weight:700;font-size:20px;letter-spacing:-.02em;white-space:nowrap}
.logo span{font-weight:400;color:#B8B3AA;font-size:12.5px;letter-spacing:0;margin-left:8px}
.search{position:relative;flex:1;max-width:440px}
.search input{width:100%;height:36px;border:0;border-radius:4px;background:#2A2927;color:#fff;padding:0 12px 0 34px;font-size:14px;outline:none}
.search input::placeholder{color:#A8A39A}
.search input:focus{background:#fff;color:var(--ink)}
.search svg{position:absolute;left:11px;top:10px;width:16px;height:16px;stroke:#A8A39A;pointer-events:none}
.results{position:absolute;top:40px;left:0;right:0;background:#fff;color:var(--ink);border:1px solid var(--rule);border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.12);display:none;max-height:360px;overflow:auto;z-index:40}
.results.open{display:block}
.results a{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-bottom:1px solid var(--soft)}
.results a:last-child{border-bottom:0}
.results a:hover,.results a.sel{background:var(--soft)}
.results .none{padding:10px 12px;color:var(--grey)}
nav.main{display:flex;gap:22px;margin-left:auto}
nav.main a{color:#D9D5CE;font-size:14px;padding:18px 0 16px;border-bottom:2px solid transparent}
nav.main a:hover{color:#fff}
nav.main a.on{color:#fff;border-bottom-color:#fff}
.m-only{display:none}
.mbtn{background:none;border:0;color:#fff;padding:8px 0;cursor:pointer;font-size:14px}
.mpanel{display:none;background:var(--bar);border-top:1px solid #2E2D2A;padding:4px 0 10px}
.mpanel.open{display:block}
.mpanel a{display:block;padding:11px 0;color:#E8E5DF;border-bottom:1px solid #2A2927;font-size:15px}
.mpanel a:last-child{border-bottom:0}
.msearch{display:none;padding:0 0 10px}
.msearch.open{display:block}
.msearch .search{max-width:none}
.tape{background:#fff;border-bottom:1px solid var(--rule);min-height:46px;overflow:hidden}
.tape .tradingview-widget-copyright{font-size:11px;color:var(--light);text-align:right;padding:0 12px 2px}
.tape .tradingview-widget-copyright a{color:var(--light)}

/* Mise en page */
main{padding:18px 0 48px;min-height:calc(100vh - 56px)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:20px;align-items:start}
.cols > *{min-width:0}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:4px;margin-bottom:20px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.ph h2{font-size:15px}
.ph a{font-size:13px;color:var(--link)}
.ph a:hover{text-decoration:underline}
.pb{padding:14px 16px}
.crumbs{font-size:12.5px;color:var(--grey);margin-bottom:10px}
.crumbs a:hover{text-decoration:underline}
.pagetitle{font-size:24px;letter-spacing:-.01em;margin-bottom:4px}
.pagesub{color:var(--grey);margin:0 0 16px}
.src{font-size:12px;color:var(--light);padding:8px 16px;border-top:1px solid var(--soft)}
.src a{color:var(--link)}
.notice{background:var(--hl);border:1px solid #EFE3B0;border-radius:4px;padding:10px 14px;font-size:13px;color:#5A4E1F;margin-bottom:16px}

/* Modules de cours TradingView */
.tv{width:100%}
.tv .tradingview-widget-copyright{font-size:11.5px;color:var(--light);padding:4px 16px 8px}
.tv .tradingview-widget-copyright a{color:var(--light)}
.tv-chart{height:340px}
.tv-chart .tradingview-widget-container,.tv-chart .tradingview-widget-container__widget{height:100%}
.tv-fin{height:520px}
.tv-quotes{height:430px}
.tv-fin .tradingview-widget-container,.tv-quotes .tradingview-widget-container{height:100%}
.tv-fin .tradingview-widget-container__widget,.tv-quotes .tradingview-widget-container__widget{height:calc(100% - 26px)}

/* Filtres en texte */
.filters{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;padding:0 16px;border-bottom:1px solid var(--rule)}
.filters::-webkit-scrollbar{display:none}
.filters button,.filters a{background:none;border:0;padding:9px 0 8px;font-size:13.5px;color:var(--grey);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.filters .on{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}

/* Tableaux */
table.t{width:100%;border-collapse:collapse}
table.t th{font-weight:500;font-size:12px;color:var(--grey);text-align:right;padding:8px 12px;border-bottom:1px solid var(--rule);white-space:nowrap;background:#FBFAF8}
table.t td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--soft);white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left;padding-left:16px}
table.t th:last-child,table.t td:last-child{padding-right:16px}
table.t tr:last-child td{border-bottom:0}
table.t.click tbody tr{cursor:pointer}
table.t.click tbody tr:hover td{background:#FAF9F6}
table.t th.sort{cursor:pointer;user-select:none}
table.t .nm{font-weight:500}
table.t .sub{font-size:12px;color:var(--light);font-weight:400}
table.t td.l,table.t th.l{text-align:left}
table.t td.wrap{white-space:normal}
.scroll-x{overflow-x:auto;overscroll-behavior-x:contain}

/* Fil d'actualité */
.feed .it{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:10px 16px;border-bottom:1px solid var(--soft)}
.feed .it:last-child{border-bottom:0}
.feed .when{font-size:12px;color:var(--light);line-height:1.35}
.feed .when b{display:block;color:var(--grey);font-weight:500}
.feed .co{font-size:12px;font-weight:600;color:var(--link);margin-right:6px}
.feed .ty{font-size:11.5px;color:var(--grey);border:1px solid var(--rule);border-radius:3px;padding:0 5px;margin-right:6px;white-space:nowrap;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.feed .ti{font-weight:500;display:block}
.feed a.ti:hover{text-decoration:underline}
.empty{padding:22px 16px;color:var(--grey);text-align:center}

/* Agenda latéral */
.ag .it{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:8px 16px;border-bottom:1px solid var(--soft)}
.ag .it:last-child{border-bottom:0}
.ag .d{font-size:12px;color:var(--grey);line-height:1.3}
.ag .d b{display:block;font-size:15px;color:var(--ink)}
.ag .co{font-weight:500}
.ag .co:hover{text-decoration:underline}
.ag .ev{font-size:13px;color:var(--grey)}

/* Liste de données clés */
.kv{width:100%;border-collapse:collapse}
.kv td{padding:7px 16px;border-bottom:1px solid var(--soft)}
.kv tr:last-child td{border-bottom:0}
.kv td:last-child{text-align:right;font-weight:500;white-space:nowrap}
.kv .s{display:block;font-size:12px;color:var(--light);font-weight:400}

/* Définitions */
.def{background:none;border:0;padding:0;cursor:help;text-align:left;border-bottom:1px dotted #A8A39A;line-height:1.3}
.def:hover{border-bottom-color:var(--ink)}
.pop{position:absolute;z-index:50;width:320px;max-width:calc(100vw - 24px);background:#fff;border:1px solid var(--rule);border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:12px 14px;font-size:13px;display:none;outline:none}
.pop.open{display:block}
.pop h4{margin:0 0 4px;font-size:14px;padding-right:20px}
.pop p{margin:6px 0 0}
.pop .k{color:var(--grey)}
.pop a{color:var(--link)}
.pop .x{position:absolute;right:8px;top:6px;background:none;border:0;font-size:18px;color:var(--grey);cursor:pointer}
.defs{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 16px;border-bottom:1px solid var(--soft);font-size:13px}

/* En-tête de fiche */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:14px 16px;border-bottom:1px solid var(--rule)}
.qhead h1{font-size:24px;letter-spacing:-.01em}
.qhead .id{font-size:12.5px;color:var(--grey);margin-top:3px}
.qhead .px{width:380px;max-width:100%}
.qtabs{display:flex;gap:22px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.qtabs::-webkit-scrollbar{display:none}
.qtabs a{padding:11px 0 9px;font-size:14px;color:var(--grey);border-bottom:2px solid transparent;white-space:nowrap}
.qtabs a.on{color:var(--ink);font-weight:500;border-bottom-color:var(--ink)}
.qtabs a:hover{color:var(--ink)}

/* Graphiques des simulateurs */
.chart{position:relative;width:100%;height:280px;touch-action:pan-y}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:5px 8px;border-radius:3px;white-space:nowrap;transform:translate(-50%,-100%);display:none;z-index:2}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--grey);margin-top:6px}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:6px}

/* Synthèse */
.syn dl{margin:0;display:grid;grid-template-columns:130px 1fr;gap:0}
.syn dt{padding:9px 0 9px 16px;font-weight:600;font-size:13px;border-bottom:1px solid var(--soft)}
.syn dd{margin:0;padding:9px 16px 9px 8px;border-bottom:1px solid var(--soft)}
.syn dl > :nth-last-child(-n+2){border-bottom:0}

/* Comptes */
table.fin td.l{min-width:240px}
table.fin tr.grp td{background:#FBFAF8;font-weight:600;font-size:12px;color:var(--grey);text-transform:uppercase;letter-spacing:.04em;padding-top:10px}
table.fin td.ref{color:var(--light)}

/* Simulateurs et portefeuille */
.sim{display:grid;grid-template-columns:320px minmax(0,1fr)}
.sim .form{padding:16px;border-right:1px solid var(--rule)}
.sim .res{padding:16px;min-width:0}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--grey);margin-bottom:4px}
.field input,.field select{width:100%;height:36px;border:1px solid var(--rule);border-radius:4px;background:#fff;padding:0 9px;font-size:14px;outline:none}
.field input:focus,.field select:focus{border-color:var(--ink)}
.field .hint{font-size:12px;color:var(--light);margin-top:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.lines .ln{display:grid;grid-template-columns:1fr 66px 22px;gap:6px;margin-bottom:6px;align-items:center}
.lines select,.lines input{height:34px;border:1px solid var(--rule);border-radius:4px;background:#fff;padding:0 7px;font-size:13.5px;width:100%;min-width:0}
.lines .x{background:none;border:0;cursor:pointer;color:var(--grey);font-size:18px;line-height:1;padding:0}
.linkbtn{background:none;border:0;padding:2px 0;color:var(--link);cursor:pointer;font-size:13.5px}
.linkbtn:hover{text-decoration:underline}
.btn{display:inline-block;height:36px;padding:0 16px;border-radius:4px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;font-weight:500;font-size:14px}
.wsum{font-size:12px;color:var(--grey);margin:2px 0 10px}
.wsum.bad{color:var(--down)}
.figs{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule);border-radius:4px;margin-bottom:14px}
.figs > div{padding:10px 12px;border-right:1px solid var(--soft)}
.figs > div:last-child{border-right:0}
.figs .k{font-size:12px;color:var(--grey)}
.figs .v{font-size:19px;font-weight:600;letter-spacing:-.01em;margin-top:1px}
.figs .s{font-size:12px;color:var(--light)}
table.meas{width:100%;border-collapse:collapse;margin-top:14px}
table.meas td{padding:7px 0;border-bottom:1px solid var(--soft);vertical-align:top}
table.meas td:nth-child(2),table.meas td:nth-child(3){text-align:right;white-space:nowrap;padding-left:12px}
table.meas td:nth-child(2){font-weight:500}
table.meas td:nth-child(3){color:var(--grey)}
table.meas th{text-align:right;font-size:12px;color:var(--grey);font-weight:500;padding:0 0 5px 12px}
table.meas th:first-child{text-align:left;padding-left:0}
table.meas .h{font-size:12px;color:var(--light);display:block;font-weight:400}
.note{font-size:12.5px;color:var(--grey);margin-top:12px}
.note p{margin:0 0 5px}
.rep .r{display:grid;grid-template-columns:130px 1fr 46px;gap:10px;align-items:center;font-size:13px;padding:3px 0}
.rep .bar_{height:7px;background:var(--soft);border-radius:2px;overflow:hidden}
.rep .bar_ span{display:block;height:100%;background:var(--ink)}
.cap{font-size:12px;font-weight:600;color:var(--grey);text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.ops .del{background:none;border:0;color:var(--grey);cursor:pointer;font-size:17px;line-height:1;padding:0 2px}
.ops input.px{width:90px;height:30px;border:1px solid var(--rule);border-radius:4px;padding:0 6px;text-align:right;font-size:13.5px}

/* Lexique */
.lex{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start}
.lexnav{position:sticky;top:72px;font-size:13.5px;padding:8px 0}
.lexnav a{display:block;padding:4px 16px;color:var(--grey)}
.lexnav a:hover{color:var(--ink)}
.lexnav .g{font-size:12px;font-weight:600;color:var(--ink);text-transform:uppercase;letter-spacing:.04em;padding:10px 16px 4px}
.term{padding:14px 16px;border-bottom:1px solid var(--soft);scroll-margin-top:70px}
.term:last-child{border-bottom:0}
.term h3{font-size:16px}
.term p{margin:4px 0 0;max-width:720px}
.term dl{display:grid;grid-template-columns:130px 1fr;gap:4px 14px;margin:8px 0 0;max-width:760px;font-size:13.5px}
.term dt{color:var(--grey)}
.term dd{margin:0}

footer{border-top:1px solid var(--rule);padding:20px 0 32px;font-size:12.5px;color:var(--grey);background:var(--panel)}
footer .f{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
footer p{margin:0 0 4px}
footer a{margin-left:16px}
footer a:hover{color:var(--ink)}

@media (max-width:1040px){
  .cols{grid-template-columns:minmax(0,1fr)}
  nav.main{gap:16px}
  .sim{grid-template-columns:1fr}
  .sim .form{border-right:0;border-bottom:1px solid var(--rule)}
}
@media (max-width:760px){
  :root{--gut:12px}
  .d-only{display:none!important}
  .m-only{display:block}
  .bar .in{gap:12px;height:50px}
  .logo span{display:none}
  .bar .in .mright{margin-left:auto;display:flex;gap:16px}
  main{padding:12px 0 36px}
  .panel{margin-bottom:12px}
  .ph{padding:10px 12px}
  .pb{padding:12px}
  .filters{padding:0 12px;gap:16px}
  table.t th,table.t td{padding:8px 8px}
  table.t th:first-child,table.t td:first-child{padding-left:12px}
  table.t th:last-child,table.t td:last-child{padding-right:12px}
  .feed .it{grid-template-columns:1fr;gap:2px;padding:10px 12px}
  .feed .when b{display:inline;margin-right:6px}
  .ag .it{padding:8px 12px}
  .kv td{padding:7px 12px}
  .defs{padding:10px 12px}
  .qhead{flex-direction:column;align-items:stretch;gap:8px;padding:12px}
  .qhead .px{width:auto}
  .qtabs{padding:0 12px;gap:18px}
  .tv-chart{height:260px}
  .syn dl{grid-template-columns:1fr}
  .syn dt{padding:9px 12px 0;border-bottom:0}
  .syn dd{padding:2px 12px 9px}
  table.fin td.l{min-width:150px;position:sticky;left:0;background:#fff;z-index:1;box-shadow:1px 0 0 var(--soft)}
  table.fin th.l{position:sticky;left:0;z-index:1}
  .sim .form,.sim .res{padding:12px}
  .figs{grid-template-columns:1fr 1fr}
  .figs > div:nth-child(2){border-right:0}
  .figs > div:nth-child(-n+2){border-bottom:1px solid var(--soft)}
  table.meas{font-size:13px;table-layout:fixed}
  table.meas td:nth-child(2),table.meas td:nth-child(3){white-space:normal;width:28%}
  .rep .r{grid-template-columns:100px 1fr 42px}
  .two{grid-template-columns:1fr;gap:16px}
  .lex{grid-template-columns:1fr}
  .lexnav{display:none}
  .term{padding:12px}
  .term dl{grid-template-columns:1fr;gap:1px}
  .term dd{margin-bottom:6px}
  .pop{position:fixed;left:12px!important;right:12px;bottom:12px;top:auto!important;width:auto;max-width:none}
}
/* ---------- Présentation plus douce (refonte du 28/10) ---------- */
:root{--page:#F7F6F3;--rule:#ECE9E3;--soft:#F3F1ED;--radius:14px}
.bar{background:#fff;color:var(--ink);border-bottom:1px solid var(--rule)}
.logo span{color:var(--light)}
.search input{background:#F3F1ED;color:var(--ink);border-radius:10px}
.search input::placeholder{color:#8A857D}
.search input:focus{background:#fff;box-shadow:0 0 0 1px var(--rule)}
nav.main a{color:var(--grey)}
nav.main a:hover,nav.main a.on{color:var(--ink)}
nav.main a.on{border-bottom-color:var(--ink)}
.mbtn{color:var(--ink)}
.mpanel{background:#fff;border-top:1px solid var(--rule)}
.mpanel a{color:var(--ink);border-bottom-color:var(--soft)}
.results{border-radius:12px}
.panel{border-radius:var(--radius);border-color:var(--rule);box-shadow:0 1px 2px rgba(20,20,20,.03);overflow:hidden}
.ph{padding:14px 18px}
.ph h2{font-size:15.5px}
table.t th{background:#FAF9F7;font-size:12px;padding:10px 12px}
table.t td{padding:11px 12px}
table.t th:first-child,table.t td:first-child{padding-left:18px}
table.t th:last-child,table.t td:last-child{padding-right:18px}
.kv td{padding:10px 18px}
.figs{border-radius:12px}
.field input,.field select,.lines select,.lines input{border-radius:10px}
.btn{border-radius:10px}
.pop{border-radius:12px}
.pagetitle{font-size:28px;letter-spacing:-.02em}
.hero{padding:22px 0 4px}
.hero h1{font-size:32px;letter-spacing:-.02em;line-height:1.15}
.hero p{color:var(--grey);font-size:16px;margin:10px 0 0;max-width:640px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0 36px}
.step{background:#fff;border:1px solid var(--rule);border-radius:var(--radius);padding:18px;transition:border-color .15s,box-shadow .15s}
