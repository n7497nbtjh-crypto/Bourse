function presse(k){const p=PRESSE[k];if(!p)return "";return `<div class="bx" data-o="pr"><p class="lab"><i>❝</i>Ce que dit la presse</p><div class="kpi">${p.tags.map(t=>`<span class="pill y">${t}</span>`).join("")}</div><p class="txt">${p.txt}</p><button class="more">Lire la suite</button><details><summary>Pour aller plus loin<sup>${p.arts.length}</sup></summary>${p.arts.map(a=>`<a href="${a[1]}" target="_blank" rel="noopener">${a[0]} ↗</a>`).join("")}</details></div>`}
function panneau(k){const d=D[k];if(d.type=="etf")return `<div class="ph"><b>${d.nom}</b><span class="${C(d.v)}" style="font:800 20px Bricolage Grotesque">${F(d.v)}</span><a href="#">Voir la fiche ↗</a></div><div class="cols deux"><div class="bx vis"><p class="lab"><i>?</i>Ce qui a fait bouger cet ETF</p><p class="note">Ici, les entreprises du fonds qui ont le plus pesé sur sa semaine (poids dans l'ETF × variation), et ce que cela représente sur vos ${Math.round(d.pf.valeur_eur).toLocaleString("fr-FR")} €. Le rapport d'exemple actuel a été figé avant cette fonction : il sera rempli avec le rapport de vendredi.</p></div><div class="bx"><p class="lab"><i>≈</i>Face aux ETF du même indice</p><p class="note">Même principe que les rivales, avec les autres ETF MSCI World.</p></div></div>`;
 const pr=presse(k);return `<div class="ph"><b>${d.nom}</b><span class="${C(d.v)}" style="font:800 20px Bricolage Grotesque">${F(d.v)}</span><a href="#">Voir la fiche ↗</a></div>
 <div class="tabs"><button class="on" data-t="pq">Pourquoi</button>${pr?'<button data-t="pr">Presse</button>':""}<button data-t="riv">Rivales</button></div>
 <div class="cols ${pr?"":"deux"}"><div class="bx vis" data-o="pq"><p class="lab"><i>✦</i>Pourquoi elle a bougé</p><p class="lead">${lead(d)}</p>${bars(d)}${kpi(d)}${jours(d)}</div>${pr}${riv(d)}</div>`}
g.innerHTML=ks.map(tuile).join("")+'<div class="pan" id="pan"></div>';
const pan=document.getElementById("pan");
function ouvrir(k){document.querySelectorAll(".t").forEach(t=>t.classList.toggle("on",t.dataset.k==k));const i=ks.indexOf(k),n=getComputedStyle(g).gridTemplateColumns.split(" ").length;pan.style.order=Math.min(ks.length-1,(Math.floor(i/n)+1)*n-1);pan.innerHTML=panneau(k);pan.classList.add("on");
 pan.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{pan.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x==b));pan.querySelectorAll(".cols .bx").forEach(x=>x.classList.toggle("vis",x.dataset.o==b.dataset.t))});
 const m=pan.querySelector(".more");if(m)m.onclick=()=>{pan.querySelector(".txt").classList.toggle("all");m.textContent=m.textContent=="Lire la suite"?"Réduire":"Lire la suite"}}
g.addEventListener("click",e=>{const t=e.target.closest(".t");if(t)ouvrir(t.dataset.k)});
ouvrir(location.hash.slice(1)||"c:apple");
</script></body></html>
